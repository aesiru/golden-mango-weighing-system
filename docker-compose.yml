# ============================================================
# Golden Mango Weighing System — Docker Compose
# ============================================================
# Starts PostgreSQL and Mosquitto MQTT for local development.
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose down           # stop and remove containers
#   docker compose down -v        # stop and DELETE all data

services:
  postgres:
    image: postgres:16-alpine
    container_name: mango-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: golden_mango_db
      POSTGRES_USER: mango_user
      POSTGRES_PASSWORD: mango_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango_user -d golden_mango_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mango-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

volumes:
  pgdata:
    name: mango-pgdata
  mosquitto-data:
    name: mango-mosquitto-data
